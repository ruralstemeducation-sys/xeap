name: Site vệ tinh

on:
  schedule:
    - cron: '17 */2 * * *'   # 2 giờ một lần
  workflow_dispatch:          # bấm "Run workflow" để cập nhật ngay
  push:
    paths: ['satellites/**', '.github/workflows/satellites.yml']

concurrency:
  group: satellites
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dựng site
        run: node satellites/build.mjs

      - name: Đưa lên Cloudflare Pages
        # Chỉ đưa lên khi chạy trên nhánh mặc định; nhánh khác chỉ dựng để kiểm tra.
        if: env.CLOUDFLARE_API_TOKEN != '' && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
        run: |
          npm install -g wrangler@3
          for dir in satellites/dist/*/; do
            domain=$(basename "$dir")
            project=$(echo "$domain" | tr '.' '-')
            wrangler pages project create "$project" --production-branch main >/dev/null 2>&1 || true
            wrangler pages deploy "$dir" --project-name "$project" --branch main --commit-dirty=true
          done

      - name: Chưa cấu hình Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Chưa có secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID – mới chỉ dựng, chưa đưa lên."
